name: Main kittygram workflow
on: 
  push:
    branches:
      - main
jobs:
  backend_test:
    runs-on: ubuntu-latest
    services:
      posrtes:
        image: postgres:13.10
        env:
          POSRGRES_USER: django_user
          POSRGRES_DB: django_db
          POSTGRES_PASSWORD: <PASSWORD>
        ports: 
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: check out code base
        uses: actions/checkout@v3
      - name: python setup
        uses: actions/setup-python@v4
        with:
          python-version: 3.12
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools
          pip install flake8==7.3.0 flake8-isort==7.0.0
          pip install -r ./backend/requirements.txt
      - name: test with flake8 and tests
        env:
          POSRGRES_USER: django_user
          POSRGRES_DB: django_db
          POSTGRES_PASSWORD: <PASSWORD>
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
        run: |
          python3 -m flake8 backend/
          python3 backend/manage.py test
  frontend_tests:
    runs-on: ubuntu-latest
    steps:
    - name: checot code base
      uses: actions/checkout@v3
    - name: Set up nodeJS
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install dependencies
      run: |
        cd frontend/
        npm ci

    - name: Test frontend
      run: |
        cd frontend/
        npm run test
  build_backend_and_push:
    runs-on: ubuntu-latest
    needs: backend_test
    steps:
      - name: Check out code base
        uses: actions/checkout@v3
      - name: Set up docker buildix
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to Docker HUB
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/kittygram_backend:latest
  build_frontend_and_push:
    runs-on: ubuntu-latest
    needs: frontend_tests
    steps:
      - name: Check out code base
        uses: actions/checkout@v3
      - name: Set up docker buildix
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to Docker HUB
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/kittygram_frontend:latest
  build_gateway_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code base
        uses: actions/checkout@v3
      - name: Login to docker hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: push to docker hub
        uses: docker/build-push-action@v4
        with:
          context: ./nginx
          push: true
          tags: ${{ secrets.DOCKER_USERNAME}}/kittygram_gateway:latest
  deploy:
    runs-on: ubuntu-latest
    needs:
      - build_frontend_and_push
      - build_gateway_and_push
      - build_backend_and_push
    steps:
      - name: check out repo
        uses: actions/checkout@v3
      - name: copy docker-compose.yml via ssh
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.production.yml"
          target: "kittygram" 
      - name: Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd kittygram
            sudo docker compose -f docker-compose.production.yml pull
            sudo docker compose -f docker-compose.production.yml down
            sudo docker compose -f docker-compose.production.yml up -d
            sudo docker compose -f docker-compose.production.yml exec backend python3 manage.py migrate
            sudo docker compose -f docker-compose.production.yml exec backend python3 manage.py collectstatic
            sudo docker compose -f docker-compose.production.yml exec backend cp -r /app/collected_static/. /backend_static/static/

  send_message:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
    - name: Send message
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: Деплой успешно выполнен!