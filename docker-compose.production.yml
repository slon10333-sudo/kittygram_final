version: '3'

volumes:
  pg_data:
  static:
  media:
services:
  db:
    image: postgres:13
    volumes:
      - pg_data:/var/lib/postgresql/data
    env_file:
      - .env
  backend:
    depends_on:
      - db
    env_file: .env
    volumes:
      - media:/app/media
      - static:/backend_static
    image: noherzeg/kittygram_backend:latest
    
  frontend:
    env_file: .env
    volumes:
      - static:/static
    command: cp -r /app/build/. /static/
    image: noherzeg/kittygram_frontend:latest
  gateway:
    depends_on:
      - backend
    env_file: .env
    volumes:
      - static:/static
      - media:/media
    ports:
      - 8000:80
    image: noherzeg/kittygram_gateway:latest
